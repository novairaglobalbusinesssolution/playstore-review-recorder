services:
  - type: web
    name: playstore-review-recorder
    runtime: docker
    plan: starter
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: TASKS_API_URL
        sync: false
      - key: API_SECRET_KEY
        sync: false
      - key: WEBHOOK_COMPLETE_URL
        sync: false
      - key: GDRIVE_FOLDER_ID
        sync: false
      - key: GDRIVE_SERVICE_ACCOUNT_JSON
        sync: false
